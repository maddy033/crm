name: CI

on:
  workflow_dispatch:

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            #setup node js for linter 
            - name:  Setup NodeJs
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            # install npm packages
            - name : Install npm packages
              run: npm ci
              working-directory: frontend
            # Run liter
            - name : Run Linter
              run: npm run lint || true
              working-directory: frontend

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/crm-frontend:latest

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            #setup node js for linter 
            - name:  Setup NodeJs
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: backend/package-lock.json
            # install npm packages
            - name : Install npm packages
              run: npm ci
              working-directory: frontend
            # Run liter
            - name : Run Linter
              run: npm run lint || true
              working-directory: frontend

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/crm-backenend:latest          
              
          
          
