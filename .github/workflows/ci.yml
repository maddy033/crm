name: CI

on:
  workflow_dispatch:

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            #setup node js for linter 
            - name:  Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            # install npm packages
            - name : Install npm packages
              run: npm ci

              
              
          
          
